name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXTENSION_ID: dimockbooampdcmcboibloaflhmpokbl
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and bundle libs
        run: npm ci && npm run bundle-libs

      - name: Validate extension
        run: node scripts/ci-validate.js

      - name: Read manifest version
        id: version
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Assert version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          MANIFEST="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG does not match extension/manifest.json version $MANIFEST"
            exit 1
          fi
          echo "Version OK: $MANIFEST"

      - name: Build extension zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd extension
          zip -r "../specter-${VERSION}.zip" . \
            -x "_metadata/*" \
            -x "*.md"
          cd ..
          ls -lh "specter-${VERSION}.zip"
          unzip -l "specter-${VERSION}.zip" | head -20
          unzip -l "specter-${VERSION}.zip" | grep -q 'manifest.json' || (echo 'Zip must contain manifest.json at root' && exit 1)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: specter-${{ steps.version.outputs.version }}
          path: specter-${{ steps.version.outputs.version }}.zip
          retention-days: 90

      - name: Upload package to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@2 upload \
            --source "specter-${{ steps.version.outputs.version }}.zip" \
            --extension-id "${{ env.EXTENSION_ID }}"

      - name: Submit for review (publish)
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@2 publish \
            --extension-id "${{ env.EXTENSION_ID }}"

      - name: Publish summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="specter-${VERSION}.zip"
          SIZE=$(du -h "$ZIP" | cut -f1)
          {
            echo "## Chrome Web Store upload"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Extension ID | \`${{ env.EXTENSION_ID }}\` |"
            echo "| Zip | \`${ZIP}\` (${SIZE}) |"
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "| Release | [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }}) |"
            else
              echo "| Trigger | Manual (workflow_dispatch) |"
            fi
            echo "| Uploaded (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"
